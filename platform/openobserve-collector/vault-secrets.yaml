# The collectors' own OpenObserve service account, from Vault, through Vault
# Secrets Operator: not the root user, so changing the root's password never
# stops ingestion. The Secret holds only O2_AUTH, the basic auth value, built
# from the account's email and the token OpenObserve generated for it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: openobserve-collector
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: openobserve-collector
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: openobserve-collector
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openobserve-auth
  namespace: openobserve-collector
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: openobserve-collector/ingest
  refreshAfter: 1h
  # The collectors read it at start: a new password restarts them.
  rolloutRestartTargets:
    - kind: DaemonSet
      name: openobserve-collector-agent-collector
    - kind: StatefulSet
      name: openobserve-collector-gateway-collector
  destination:
    name: openobserve-auth-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        O2_AUTH:
          text: '{{ printf "%s:%s" (get .Secrets "email") (get .Secrets "token") | b64enc }}'
