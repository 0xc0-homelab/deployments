# OpenObserve's root user, from Vault, through Vault Secrets Operator: the
# collectors send with it. The Secret holds only O2_AUTH, the basic auth
# value, built from the email and password (the vault repo,
# policies/openobserve-collector.hcl).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: openobserve-collector
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: openobserve-collector
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: openobserve-collector
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openobserve-auth
  namespace: openobserve-collector
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/openobserve-root
  refreshAfter: 1h
  # The collectors read it at start: a new password restarts them.
  rolloutRestartTargets:
    - kind: DaemonSet
      name: openobserve-collector-agent-collector
    - kind: StatefulSet
      name: openobserve-collector-gateway-collector
  destination:
    name: openobserve-auth-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        O2_AUTH:
          text: '{{ printf "%s:%s" (get .Secrets "email") (get .Secrets "password") | b64enc }}'
