fullnameOverride: openobserve-collector

# Both send to OpenObserve inside the cluster, as its root user. The header
# takes O2_AUTH from the pods' environment (kustomization.yaml patches it in
# from vault-secrets.yaml): no credential in this file.
exporters:
  otlphttp/openobserve:
    endpoint: http://openobserve.openobserve.svc.cluster.local:5080/api/default/
    headers:
      Authorization: "Basic ${env:O2_AUTH}"
  otlphttp/openobserve_k8s_events:
    endpoint: http://openobserve.openobserve.svc.cluster.local:5080/api/default/
    headers:
      Authorization: "Basic ${env:O2_AUTH}"
      stream-name: k8s_events

k8sCluster: homelab-prod

# The image the operator's collector image would be, pinned with the chart.
image:
  repository: ghcr.io/open-telemetry/opentelemetry-collector-releases/opentelemetry-collector-k8s
  tag: "0.158.0"

# kube-state-metrics, in kube-system as the gateway's job expects.
kube-state-metrics:
  enabled: true
  resources:
    requests:
      cpu: 10m
      memory: 32Mi
    limits:
      memory: 128Mi

# No applications yet: auto-instrumentation comes in phase 6.
autoinstrumentation:
  enabled: false

# One per node: every container's logs, and the node's and the pods' metrics.
agent:
  # Rocky's SELinux keeps a container from reading /var/log/pods: the chart's
  # documented way through, which is why the namespace is privileged.
  securityContext:
    privileged: true
    runAsUser: 0
    seLinuxOptions:
      type: spc_t
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  # Every minute, not every 30 s: half the metrics, nothing lost at this
  # scale. The gateway's jobs and the ServiceMonitors follow
  # (kustomization.yaml, each component's values).
  receivers:
    kubeletstats:
      collection_interval: 60s
    hostmetrics:
      collection_interval: 60s
  # Every log's level, from its body: each component writes it its own way,
  # and the container runtime's format carries none. Tried in order, the first
  # match wins: JSON ("level":"info", VSO, etcd), logfmt (level=info: ArgoCD,
  # Longhorn, external-dns, CrowdSec), klog (I1002 ...: the Kubernetes
  # components), Monolog ([date] channel.ERROR: Mautic), brackets ([INFO]:
  # Vault), a word after the timestamp (INF, WARN, info: Traefik, OpenObserve,
  # the collector). Then one spelling each,
  # and the matching severity number.
  processors:
    transform/severity:
      error_mode: ignore
      log_statements:
        - context: log
          statements:
            - merge_maps(cache, ExtractPatterns(body, "\"(?:level|lvl|severity)\"\\s*:\\s*\"(?P<lvl>[A-Za-z]+)\""), "upsert") where IsString(body) and IsMatch(body, "\"(level|lvl|severity)\"\\s*:\\s*\"[A-Za-z]")
            - merge_maps(cache, ExtractPatterns(body, "\\blevel=\"?(?P<lvl>[A-Za-z]+)"), "upsert") where cache["lvl"] == nil and IsString(body) and IsMatch(body, "\\blevel=\"?[A-Za-z]")
            - merge_maps(cache, ExtractPatterns(body, "^(?P<lvl>[IWEF])\\d{4} \\d{2}:"), "upsert") where cache["lvl"] == nil and IsString(body) and IsMatch(body, "^[IWEF]\\d{4} \\d{2}:")
            - merge_maps(cache, ExtractPatterns(body, "^\\[[^\\]]+\\] [\\w.-]+\\.(?P<lvl>DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY):"), "upsert") where cache["lvl"] == nil and IsString(body) and IsMatch(body, "^\\[[^\\]]+\\] [\\w.-]+\\.(DEBUG|INFO|NOTICE|WARNING|ERROR|CRITICAL|ALERT|EMERGENCY):")
            - merge_maps(cache, ExtractPatterns(body, "\\[(?P<lvl>TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL)\\]"), "upsert") where cache["lvl"] == nil and IsString(body) and IsMatch(body, "\\[(TRACE|DEBUG|INFO|WARN|WARNING|ERROR|FATAL)\\]")
            - merge_maps(cache, ExtractPatterns(body, "^\\S+\\s+(?P<lvl>(?i:trace|debug|info|warn|warning|error|fatal|inf|wrn|err|dbg|ftl))\\b"), "upsert") where cache["lvl"] == nil and IsString(body) and IsMatch(body, "^\\S+\\s+(?i:trace|debug|info|warn|warning|error|fatal|inf|wrn|err|dbg|ftl)\\b")
            - set(severity_text, ToUpperCase(cache["lvl"])) where cache["lvl"] != nil
            - set(severity_text, "INFO") where severity_text == "I" or severity_text == "INF" or severity_text == "NOTICE"
            - set(severity_text, "WARN") where severity_text == "W" or severity_text == "WRN" or severity_text == "WARNING"
            - set(severity_text, "ERROR") where severity_text == "E" or severity_text == "ERR"
            - set(severity_text, "FATAL") where severity_text == "F" or severity_text == "FTL" or severity_text == "CRITICAL" or severity_text == "ALERT" or severity_text == "EMERGENCY"
            - set(severity_text, "DEBUG") where severity_text == "DBG"
            - set(severity_number, SEVERITY_NUMBER_TRACE) where severity_text == "TRACE"
            - set(severity_number, SEVERITY_NUMBER_DEBUG) where severity_text == "DEBUG"
            - set(severity_number, SEVERITY_NUMBER_INFO) where severity_text == "INFO"
            - set(severity_number, SEVERITY_NUMBER_WARN) where severity_text == "WARN"
            - set(severity_number, SEVERITY_NUMBER_ERROR) where severity_text == "ERROR"
            - set(severity_number, SEVERITY_NUMBER_FATAL) where severity_text == "FATAL"
    # Mautic's workers print the same banner on every start, every five
    # minutes, blank lines included: nothing in it but noise. After
    # k8sattributes, which sets the namespace (the file path gives only the
    # pod's UID).
    filter/noise:
      error_mode: ignore
      logs:
        log_record:
          - resource.attributes["k8s.namespace.name"] == "mautic" and IsString(body) and IsMatch(body, "^\\s*$|^ // |^ \\[OK\\] Consuming messages from transport")
  service:
    pipelines:
      logs:
        receivers: [filelog/std]
        processors: [memory_limiter, transform/severity, resourcedetection, attributes, k8sattributes, filter/noise, batch]
        exporters: [otlphttp/openobserve]

# One replica: traces (OTLP), Kubernetes events, and every Prometheus target,
# from the ServiceMonitors through the target allocator.
gateway:
  targetAllocator:
    enabled: true
    resources:
      requests:
        cpu: 10m
        memory: 64Mi
      limits:
        memory: 256Mi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Only the events: the other object watches copy every configmap, role and
  # service account into a stream, for little use and much memory.
  receivers:
    k8sobjects/pods: null
    k8sobjects/nodes: null
    k8sobjects/deployments: null
    k8sobjects/services: null
    k8sobjects/namespaces: null
    k8sobjects/pvcs: null
    k8sobjects/daemonsets: null
    k8sobjects/statefulsets: null
    k8sobjects/ingresses: null
    k8sobjects/jobs: null
    k8sobjects/cronjobs: null
    k8sobjects/persistentvolumes: null
    k8sobjects/serviceaccounts: null
    k8sobjects/roles: null
    k8sobjects/clusterroles: null
    k8sobjects/rolebindings: null
    k8sobjects/clusterrolebindings: null
    k8sobjects/hpa: null
    k8sobjects/crds: null
    k8sobjects/storageclasses: null
    k8sobjects/configmaps: null
    k8sobjects/networkpolicies: null
    k8sobjects/endpoints: null
    k8sobjects/replicasets: null
    k8sobjects/limitranges: null
    k8sobjects/resourcequotas: null
  processors:
    # What no dashboard uses and costs the most to keep: Go's runtime metrics
    # of every component, etcd's debugging ones, the controllers' and
    # Longhorn's internal queues and clients, Vault's per-route and storage
    # internals. Measured on 2026-10-02, the families that filled the volume.
    filter/noise:
      error_mode: ignore
      metrics:
        metric:
          - IsMatch(name, "^go_")
          - IsMatch(name, "^kubernetes_feature_enabled$")
          - IsMatch(name, "^grpc_server_")
          - IsMatch(name, "^etcd_debugging_")
          - IsMatch(name, "^(workqueue|rest_client)_")
          - IsMatch(name, "^longhorn_(rest_client|workqueue)_")
          - IsMatch(name, "^vault_(route|rollback|runtime|raft_storage_bolt)_")
          # Per-target scrape statistics the receiver makes up, the
          # scheduler's per-plugin histograms, and the process_* of every
          # component but its memory and CPU.
          - IsMatch(name, "^scrape_")
          - IsMatch(name, "^scheduler_plugin_")
          - IsMatch(name, "^process_") and not IsMatch(name, "^process_(resident_memory_bytes|cpu_seconds_total)$")
          # Keep-lists for the three that report most about themselves: what
          # the dashboards use, and a little more worth having at hand.
          - IsMatch(name, "^vault_") and not IsMatch(name, "^vault_(core_(unsealed|active|handle_request|leadership_lost|check_token)|raft_(peers|committime|leader_lastcontact|apply|state_)|autopilot_|expire_num_leases|barrier_(get|put)|token_count|secret_kv_count)")
          - IsMatch(name, "^zo_") and not IsMatch(name, "^zo_(ingest_(records|bytes|memtable_bytes|wal_used_bytes)|http_(incoming_requests|response_time)|storage_(write|read)_bytes|query_(running|pending)_nums|node_(disk|memory|cpu)_usage)")
          - IsMatch(name, "^otelcol_") and not IsMatch(name, "^otelcol_(exporter_(sent|send_failed|queue_size|queue_capacity)|receiver_(accepted|refused|failed)|processor_(incoming|outgoing|dropped))")
    # The API server's latency histogram, by verb only: by resource and scope
    # it was millions of rows an hour, for a p99 by verb.
    transform/aggregate:
      error_mode: ignore
      metric_statements:
        - context: metric
          statements:
            - aggregate_on_attributes("sum", ["verb"]) where name == "apiserver_request_duration_seconds"
  service:
    pipelines:
      metrics:
        receivers: [otlp, servicegraph, prometheus]
        processors: [memory_limiter, filter/noise, transform/aggregate, resourcedetection, attributes, k8sattributes, batch]
        exporters: [otlphttp/openobserve]
      logs/k8s_events:
        receivers: [k8sobjects/events]
        processors: [memory_limiter, resourcedetection, attributes, k8sattributes, batch]
        exporters: [otlphttp/openobserve_k8s_events]
