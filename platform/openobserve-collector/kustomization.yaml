# Backups: no volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openobserve-collector
helmCharts:
  - name: openobserve-collector
    repo: https://charts.openobserve.ai
    version: 0.5.0
    releaseName: openobserve-collector
    namespace: openobserve-collector
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
patches:
  # The chart takes the Authorization header as a literal only.
  - target:
      kind: OpenTelemetryCollector
    patch: |-
      - op: add
        path: /spec/env/-
        value:
          name: O2_AUTH
          valueFrom:
            secretKeyRef:
              name: openobserve-auth-vault
              key: O2_AUTH
  # etcd's metrics, which the chart does not scrape (infrastructure's
  # rke2_server role exposes them on 2381).
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: add
        path: /spec/config/receivers/prometheus/config/scrape_configs/-
        value:
          job_name: etcd
          scrape_interval: 60s
          scrape_timeout: 10s
          kubernetes_sd_configs:
            - role: pod
              namespaces:
                names: [kube-system]
          relabel_configs:
            - source_labels: [__meta_kubernetes_pod_label_component]
              action: keep
              regex: etcd
            - source_labels: [__address__]
              action: replace
              regex: "([^:]+)(?::\\d+)?"
              replacement: "$1:2381"
              target_label: __address__
            - source_labels: [__meta_kubernetes_pod_node_name]
              target_label: node
  # Once a minute: the chart's jobs and the allocator's default are 30 s.
  - target:
      kind: OpenTelemetryCollector
      name: openobserve-collector-gateway
    patch: |-
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/0/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/1/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/2/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/3/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/4/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/5/scrape_interval
        value: 60s
      - op: replace
        path: /spec/config/receivers/prometheus/config/scrape_configs/6/scrape_interval
        value: 60s
      - op: add
        path: /spec/targetAllocator/prometheusCR/scrapeInterval
        value: 60s
