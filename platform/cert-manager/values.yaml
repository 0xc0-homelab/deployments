# Values for the cert-manager chart (kustomization.yaml pins its version).
# Images pinned by digest, the multi-arch index. Bumping is its own commit.
crds:
  enabled: true
  keep: true
image:
  digest: sha256:70f532fd9cfde0b09d55687200942399d89838bc2d5d5b45152eb799a15912b8
webhook:
  image:
    digest: sha256:a60e2dac46dbb8a7f3df95c54ce941012f54c2fe022f0ee55aaa1ab40ed957ae
cainjector:
  image:
    digest: sha256:c85268c64f2e0e76684bf5fe8906caff34b82523561c6affe0fae3546bd87562
acmesolver:
  image:
    digest: sha256:699b40d622211ab7accad8a21b04c5fbaa1841ef7a12621e8de492dbe27b2503
# A Helm test in all but name; Argo CD would run it as a hook on every sync.
startupapicheck:
  enabled: false
# The DNS-01 self-check asks Cloudflare's resolvers, never the cluster's: the
# TXT record must be visible from outside before Let's Encrypt is asked.
dns01RecursiveNameservers: "1.1.1.1:53,1.0.0.1:53"
dns01RecursiveNameserversOnly: true
# Metrics (9402) for OpenObserve's collector: the controller's and the
# webhook's.
prometheus:
  enabled: true
  servicemonitor:
    enabled: true
