# Let's Encrypt, production. Every certificate in the cluster comes from here.
# DNS-01 through Cloudflare, for every zone the token reaches: 0xc0.cc and
# offby1.cc today. The token comes from Vault (platform/shared/cloudflare),
# through Vault Secrets Operator (vault-secrets.yaml).
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: me@sergioaten.cloud
    privateKeySecretRef:
      name: letsencrypt-account-key
    solvers:
      - dns01:
          cloudflare:
            apiTokenSecretRef:
              name: cloudflare-vault
              key: api_token
