apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: cert-manager
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: cert-manager
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: cert-manager
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare
  namespace: cert-manager
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/cloudflare
  refreshAfter: 1h
  destination:
    name: cloudflare-vault
    create: true

