# cert-manager, and the ClusterIssuer every certificate comes from: Let's
# Encrypt, with DNS-01 challenges through Cloudflare (operator decision,
# 2026-09-29). Nothing needs to be reachable from the internet to get one.
#
# Backups: no volumes. Certificates and the ACME account key are Secrets, and
# a lost one is issued again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.2
    releaseName: cert-manager
    namespace: cert-manager
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - cluster-issuer.yaml
# No pruning: deleting its CRDs would delete every Certificate with them.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
