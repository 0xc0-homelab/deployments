# Let's Encrypt over DNS-01 (operator decision, 2026-09-29): nothing needs to
# be reachable from the internet.
#
# Backups: no volumes. A lost certificate is issued again.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: cert-manager
helmCharts:
  - name: cert-manager
    repo: https://charts.jetstack.io
    version: v1.21.2
    releaseName: cert-manager
    namespace: cert-manager
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - cluster-issuer.yaml
# No pruning: deleting its CRDs deletes every Certificate.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
