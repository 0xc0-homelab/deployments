# CrowdSec's bouncer, on the web entrypoint (values.yaml): every request is
# checked against the LAPI's decisions (IP reputation, the community
# blocklist, what the agents detect) and sent to AppSec, the WAF.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  plugin:
    crowdsec-bouncer:
      enabled: true
      # Decisions are pulled every minute and held in memory, rather than
      # asked for on every request.
      crowdsecMode: stream
      crowdsecLapiScheme: http
      crowdsecLapiHost: crowdsec-service.crowdsec.svc.cluster.local:8080
      crowdsecLapiKeyFile: /etc/traefik/crowdsec/key
      crowdsecAppsecEnabled: true
      crowdsecAppsecHost: crowdsec-appsec-service.crowdsec.svc.cluster.local:7422
      # AppSec down or failing blocks the request (the plugin's default):
      # the WAF fails closed.
      crowdsecAppsecUnreachableBlock: true
      crowdsecAppsecFailureBlock: true
      # The client is the last address in X-Forwarded-For that is not one of
      # the load balancers: cloudflared puts the real one there.
      forwardedHeadersTrustedIPs:
        - 10.10.4.11/32
        - 10.10.4.12/32
      logFormat: json
