# Only what no application can break (operator decision, 2026-10-02). No HSTS
# preload: it is hard to undo. Framing, CORP/COOP and CSP go on each app's
# route: Mautic's forms are framed, and its tracker loads from other sites.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: traefik
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
