# What this namespace takes from Vault, through Vault Secrets Operator: its
# VaultAuth logs in as the service account below, with the Kubernetes auth
# role named after the namespace (the vault repo), which reads only this
# namespace's paths and the shared secrets granted to it by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: traefik
# Only VSO uses it, asking the API for a token when it logs in.
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: traefik
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: traefik
    serviceAccount: vault-secrets
    audiences: [vault]
---
# The bouncer's key, shared with crowdsec: the plugin reads it as a file
# (values.yaml, volumes), which follows the Secret without a restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/crowdsec-bouncer
  refreshAfter: 1h
  destination:
    name: crowdsec-bouncer-vault
    create: true
---
# The UI basic auth, shared with longhorn-system: the dashboard's Middleware.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ui-basic-auth
  namespace: traefik
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/ui-basic-auth
  refreshAfter: 1h
  destination:
    name: ui-basic-auth-vault
    create: true
