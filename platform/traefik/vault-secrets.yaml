apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: traefik
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: traefik
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: traefik
    serviceAccount: vault-secrets
    audiences: [vault]
---
# Shared with crowdsec. Read as a file, so no restart.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: crowdsec-bouncer
  namespace: traefik
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/crowdsec-bouncer
  refreshAfter: 1h
  destination:
    name: crowdsec-bouncer-vault
    create: true
---
# Shared with longhorn-system.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ui-basic-auth
  namespace: traefik
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/ui-basic-auth
  refreshAfter: 1h
  destination:
    name: ui-basic-auth-vault
    create: true
    # basicAuth reads every key as htpasswd lines: keep only users.
    transformation:
      includes: ["^users$"]
      excludeRaw: true
