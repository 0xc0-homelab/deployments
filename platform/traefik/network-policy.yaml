# Traefik denies ingress but for its entrypoints, web, websecure and internal,
# from the two load balancers (vm-lb-01, vm-lb-02): HAProxy connects from each
# one's own address, which the NodePort keeps (externalTrafficPolicy Local).
# Nothing else in platform, the nodes included, reaches it. Its metrics (9100)
# are open to OpenObserve's collector only; its dashboard and ping stay closed; kubelet's probes come from the pod's own node,
# which a NetworkPolicy always allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: entrypoints-from-load-balancers
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.4.11/32
        - ipBlock:
            cidr: 10.10.4.12/32
      ports:
        - protocol: TCP
          port: 8000
        - protocol: TCP
          port: 8443
        - protocol: TCP
          port: 8444
---
# Traefik's metrics, scraped by OpenObserve's collector only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-collector
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 9100
