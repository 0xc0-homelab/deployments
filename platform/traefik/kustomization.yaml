apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: traefik
helmCharts:
  - name: traefik
    repo: https://traefik.github.io/charts
    version: 41.6.0
    releaseName: traefik
    namespace: traefik
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - crowdsec-bouncer.yaml
  - security-headers.yaml
  - certificates.yaml
  - dashboard.yaml
