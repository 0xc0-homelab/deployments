# The dashboard has no login of its own: basic auth guards it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ui-basic-auth
  namespace: traefik
spec:
  basicAuth:
    secret: ui-basic-auth-vault
    removeHeader: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: dashboard
  namespace: traefik
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - traefik.int.0xc0.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ui-basic-auth
      backendRefs:
        - group: traefik.io
          kind: TraefikService
          name: api@internal
