# CRDs only: the collectors' target allocator reads the ServiceMonitors. No
# Prometheus runs here.
#
# Backups: no volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: 32.0.1
    releaseName: prometheus-operator-crds
    kubeVersion: "1.36.4"
    includeCRDs: true
# No pruning: every ServiceMonitor hangs off these CRDs.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
