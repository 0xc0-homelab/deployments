# The Prometheus Operator's CRDs, and nothing else: ServiceMonitor and
# PodMonitor are how each component declares its metrics, and the
# OpenTelemetry collector's target allocator reads them (openobserve-collector).
# No Prometheus runs here.
#
# Backups: no volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
helmCharts:
  - name: prometheus-operator-crds
    repo: https://prometheus-community.github.io/helm-charts
    version: 32.0.1
    releaseName: prometheus-operator-crds
    kubeVersion: "1.36.4"
    includeCRDs: true
# No pruning: CRDs, and every ServiceMonitor in the cluster hangs off them.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
