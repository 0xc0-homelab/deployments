# The WARP-only path, to the active server only (vault-active): a standby
# would only forward.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: vault
  namespace: vault
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - vault.int.0xc0.cc
  rules:
    - backendRefs:
        - name: vault-active
          port: 8200
