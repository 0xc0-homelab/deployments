# The apps auth role admits namespaces by the vault.0xc0.cc/apps label:
# Vault looks the login's namespace up to check it.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vault-namespace-reader
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-namespace-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: vault-namespace-reader
subjects:
  - kind: ServiceAccount
    name: vault
    namespace: vault
