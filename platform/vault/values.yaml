# Upgrades are by hand: the StatefulSet updates OnDelete (README.md).
global:
  # The API is plain HTTP inside the cluster, held in by network-policy.yaml.
  # The cluster port (8201) is TLS with Vault's own certificates.
  tlsDisable: true
# Vault Secrets Operator brings secrets into the cluster.
injector:
  enabled: false
server:
  image:
    repository: hashicorp/vault
    tag: "2.0.4@sha256:5be49781ecf78bfe775c5309c6a4d9f4e9e040b6c885c99eb2b12fb69855e1a2"
  updateStrategyType: OnDelete
  # TokenReview, for the Kubernetes auth method.
  authDelegator:
    enabled: true
  # No mlock with integrated storage (HashiCorp's advice), so no IPC_LOCK:
  # the pods run restricted.
  statefulSet:
    securityContext:
      pod:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      container:
        allowPrivilegeEscalation: false
        capabilities:
          drop: [ALL]
  dataStorage:
    enabled: true
    size: 5Gi
    storageClass: longhorn
  ha:
    enabled: true
    replicas: 3
    raft:
      enabled: true
      setNodeId: true
      config: |
        ui = true
        disable_mlock = true

        # Prometheus metrics at /v1/sys/metrics for OpenObserve's collector
        # (the ServiceMonitor below). Unauthenticated, as it cannot hold a
        # Vault token. It shares the API's port, so whoever may reach 8200
        # (Traefik's WARP-only route included) can read it too.
        telemetry {
          prometheus_retention_time = "30s"
          disable_hostname          = true
        }

        listener "tcp" {
          tls_disable     = 1
          address         = "[::]:8200"
          cluster_address = "[::]:8201"

          telemetry {
            unauthenticated_metrics_access = true
          }
        }

        storage "raft" {
          path = "/vault/data"

          retry_join {
            leader_api_addr = "http://vault-0.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-1.vault-internal:8200"
          }
          retry_join {
            leader_api_addr = "http://vault-2.vault-internal:8200"
          }
        }

        service_registration "kubernetes" {}
    disruptionBudget:
      enabled: true
      maxUnavailable: 1
serverTelemetry:
  serviceMonitor:
    enabled: true
    interval: 60s
