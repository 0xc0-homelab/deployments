# In the cluster, deployed from here (operator decision, 2026-09-24). Unsealed
# by hand after every restart, no auto-unseal: README.md.
#
# Backups: each server's Raft volume (vault-data, 5Gi), in PBS's nightly backup
# of the RKE2 VMs. A Raft snapshot taken by hand is the consistent copy.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault
helmCharts:
  - name: vault
    repo: https://helm.releases.hashicorp.com
    version: 0.34.1
    releaseName: vault
    namespace: vault
    kubeVersion: "1.36.4"
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - httproute.yaml
  - namespace-reader.yaml
# No pruning: it holds the secrets.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
