controller:
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  manager:
    image:
      repository: hashicorp/vault-secrets-operator
      tag: "1.6.0@sha256:02a79a046037925d59c6a16fa7bdbf10aff1de1228c9d787d599b272b0f0c666"
  kubeRbacProxy:
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: "v0.18.1@sha256:e6a323504999b2a4d2a6bf94f8580a050378eba0900fd31335cf9df5787d9a9b"
# Plain HTTP: Vault's API has no TLS inside the cluster (platform/vault).
defaultVaultConnection:
  enabled: true
  address: http://vault-active.vault.svc.cluster.local:8200
# Each namespace brings its own VaultAuth.
defaultAuthMethod:
  enabled: false
# includeCRDs brings them; this Job would run again on every sync.
hooks:
  upgradeCRDs:
    enabled: false
telemetry:
  serviceMonitor:
    enabled: true
    interval: 60s
