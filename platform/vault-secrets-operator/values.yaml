# Values for the vault-secrets-operator chart (kustomization.yaml pins its
# version). Images pinned by digest, the multi-arch index. Bumping is its own
# commit.
controller:
  # The restricted Pod Security profile, for both containers.
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
  manager:
    image:
      repository: hashicorp/vault-secrets-operator
      tag: "1.6.0@sha256:02a79a046037925d59c6a16fa7bdbf10aff1de1228c9d787d599b272b0f0c666"
  kubeRbacProxy:
    image:
      repository: quay.io/brancz/kube-rbac-proxy
      tag: "v0.18.1@sha256:e6a323504999b2a4d2a6bf94f8580a050378eba0900fd31335cf9df5787d9a9b"
# Where Vault is, for every VaultAuth that names no connection: the active
# server, inside the cluster, plain HTTP behind Vault's NetworkPolicies (TLS on
# its API is a follow-up; gitops platform/vault).
defaultVaultConnection:
  enabled: true
  address: http://vault-active.vault.svc.cluster.local:8200
# No default auth method: each namespace brings its own VaultAuth.
defaultAuthMethod:
  enabled: false
# The CRDs come with includeCRDs; the chart's pre-upgrade Job would upgrade
# them again on every Argo CD sync.
hooks:
  upgradeCRDs:
    enabled: false
# The controller's metrics, behind kube-rbac-proxy (8443, HTTPS): the
# collector scrapes them with its own service account token.
telemetry:
  serviceMonitor:
    enabled: true
    # Once a minute, like the rest (openobserve-collector).
    interval: 60s
