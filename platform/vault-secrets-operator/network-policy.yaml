# The operator takes no connections: its metrics stay closed, and kubelet's
# probes come from the pod's own node, always allowed. Egress stays open: the
# Kubernetes API, and Vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault-secrets-operator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
