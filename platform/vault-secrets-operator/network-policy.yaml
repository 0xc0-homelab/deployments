# The operator takes no connections but its metrics, behind kube-rbac-proxy
# (8443), which only OpenObserve's collector scrapes. kubelet's probes come from the pod's own node, always allowed. Egress stays open: the
# Kubernetes API, and Vault.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: vault-secrets-operator
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
# The controller's metrics, scraped by OpenObserve's collector only. kube-rbac-proxy
# checks the bearer token.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: metrics-from-collector
  namespace: vault-secrets-operator
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: vault-secrets-operator
      control-plane: controller-manager
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
          podSelector:
            matchLabels:
              app.kubernetes.io/component: opentelemetry-collector
      ports:
        - protocol: TCP
          port: 8443
