# VSO, not External Secrets Operator (operator decision, 2026-09-30): Vault is
# the only backend, and VSO restarts what uses a secret when it changes.
#
# Backups: no volumes.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: vault-secrets-operator
helmCharts:
  - name: vault-secrets-operator
    repo: https://helm.releases.hashicorp.com
    version: 1.6.0
    releaseName: vault-secrets-operator
    namespace: vault-secrets-operator
    kubeVersion: "1.36.4"
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
patches:
  # Argo CD would run this pre-delete hook, deleting every VSO resource in the
  # cluster, whenever the Application is deleted.
  - target:
      kind: Job
      name: pdcc-vault-secrets-operator
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: pdcc-vault-secrets-operator
# No pruning: it brings CRDs. Skip the dry run: the default VaultConnection
# syncs with its own CRD.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false,SkipDryRunOnMissingResource=true
