image:
  tag: "v0.22.0@sha256:5fdcaf7deb5c158f93a1fc6fe169cdff4cfb9ae0172bee1a90ab0ef74fb9c9cf"
provider:
  name: cloudflare
env:
  - name: CF_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: cloudflare-vault
        key: api_token
sources:
  - gateway-httproute
# The target is the Gateway's target annotation: the public tunnel.
annotationFilter: gateway.0xc0.cc/public=true
# Only zones in the tunnel's own account: a CNAME from another account's zone
# fails with 1014. They match infrastructure's public_domains.
domainFilters:
  - 0xc0.cc
  - offby1.cc
# The WARP-only path's names never get a public record, whatever a route says.
excludeDomains:
  - int.0xc0.cc
policy: sync
registry: txt
txtOwnerId: homelab-prod
txtPrefix: extdns-
extraArgs:
  - --cloudflare-proxied
serviceMonitor:
  enabled: true
