# Publishing a route is a change in gitops alone (operator decision,
# 2026-09-29).
#
# Backups: no volumes. Its state is the TXT ownership records in Cloudflare.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: external-dns
helmCharts:
  - name: external-dns
    repo: https://kubernetes-sigs.github.io/external-dns
    version: 1.22.0
    releaseName: external-dns
    namespace: external-dns
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
# No pruning: it brings CRDs.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
