# What this namespace takes from Vault, through Vault Secrets Operator: its
# VaultAuth logs in as the service account below, with the Kubernetes auth
# role named after the namespace (the vault repo), which reads only this
# namespace's paths and the shared secrets granted to it by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: external-dns
# Only VSO uses it, asking the API for a token when it logs in.
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: external-dns
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: external-dns
    serviceAccount: vault-secrets
    audiences: [vault]
---
# The Cloudflare API token, shared (platform/shared/cloudflare): one copy in
# Vault, one Secret here, refreshed hourly.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: cloudflare
  namespace: external-dns
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/cloudflare
  refreshAfter: 1h
  destination:
    name: cloudflare-vault
    create: true
  # external-dns reads the token once, from its environment: restart it when
  # the token changes.
  rolloutRestartTargets:
    - kind: Deployment
      name: external-dns

