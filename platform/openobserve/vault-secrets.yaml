# The root user, from Vault, through Vault Secrets Operator. The path is shared
# with openobserve-collector, which sends with the same user (the vault repo,
# policies/openobserve.hcl).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: openobserve
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: openobserve
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: openobserve
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: openobserve-root
  namespace: openobserve
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/openobserve-root
  refreshAfter: 1h
  # A new password restarts OpenObserve, which reads it at start.
  rolloutRestartTargets:
    - kind: StatefulSet
      name: openobserve
  destination:
    name: openobserve-root-vault
    create: true
    transformation:
      excludeRaw: true
      excludes: [".*"]
      templates:
        ZO_ROOT_USER_EMAIL:
          text: '{{ get .Secrets "email" }}'
        ZO_ROOT_USER_PASSWORD:
          text: '{{ get .Secrets "password" }}'
