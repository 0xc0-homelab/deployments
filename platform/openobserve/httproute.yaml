# Not the chart's route: it adds backendless /metrics rules for Envoy Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openobserve
  namespace: openobserve
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - o2.int.0xc0.cc
  rules:
    - backendRefs:
        - name: openobserve
          port: 5080
