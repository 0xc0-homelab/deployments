# The UI and API, on the WARP-only path. OpenObserve has a login of its own: no
# basic auth in front. The chart's own route is off: it adds rules with no
# backend for /metrics, meant for Envoy Gateway.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: openobserve
  namespace: openobserve
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - o2.int.0xc0.cc
  rules:
    - backendRefs:
        - name: openobserve
          port: 5080
