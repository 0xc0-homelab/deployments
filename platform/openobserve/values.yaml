fullnameOverride: openobserve

# The root user from Vault (platform/shared/openobserve-root), through Vault
# Secrets Operator (vault-secrets.yaml): never in this file.
auth:
  existingRootUserSecret:
    name: openobserve-root-vault
    emailKey: ZO_ROOT_USER_EMAIL
    passwordKey: ZO_ROOT_USER_PASSWORD

config:
  ZO_WEB_URL: https://o2.int.0xc0.cc
  # 30 days of everything; the volume is sized for it.
  ZO_COMPACT_DATA_RETENTION_DAYS: "30"
  # Nothing leaves for OpenObserve's servers: no telemetry, no GeoIP download.
  ZO_TELEMETRY: "false"
  ZO_MMDB_DISABLE_DOWNLOAD: "true"
  # Its own metrics, ingested by itself: no scrape needed.
  ZO_SELF_METRIC_CONSUMPTION_ENABLED: "true"
  # Bounded caches, so it stays inside its memory limit. In MB.
  ZO_MEMORY_CACHE_MAX_SIZE: "256"
  ZO_MEMORY_CACHE_DATAFUSION_MAX_SIZE: "256"
  # Ingestion. A memtable rotates for the disk at ZO_MAX_FILE_SIZE_IN_MEMORY
  # (512 by default) or after ZO_MAX_FILE_RETENTION_TIME, and all of them
  # together are capped at ZO_MEM_TABLE_MAX_SIZE, past which every write gets
  # a 503 (MemoryTableOverflowError). With the rotation size as large as the
  # cap, the active memtable filled it before it ever rotated: rotate at 64,
  # well under it.
  ZO_MEM_TABLE_MAX_SIZE: "512"
  ZO_MAX_FILE_SIZE_IN_MEMORY: "64"
  ZO_MAX_FILE_RETENTION_TIME: "120"

persistence:
  enabled: true
  size: 50Gi
  storageClass: longhorn

# Pod Security "restricted".
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  seccompProfile:
    type: RuntimeDefault

# Little CPU to reserve: the nodes' requests are already high.
# Measured at 1.3 GiB with every target in (2026-10-01).
resources:
  requests:
    cpu: 100m
    memory: 1Gi
  limits:
    memory: 3Gi
