# OpenObserve denies ingress but its HTTP port (5080), from Traefik (the UI),
# from the collectors (OTLP/HTTP ingestion) and from the dashboards Job. gRPC
# (5081) stays closed. Egress stays open; the config keeps it from calling
# home.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: openobserve
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: http-from-traefik-and-collectors
  namespace: openobserve
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: openobserve-standalone
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
          podSelector:
            matchLabels:
              app.kubernetes.io/name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: openobserve-collector
        # The dashboards Job (dashboards.yaml), from this namespace.
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: openobserve-dashboards
      ports:
        - protocol: TCP
          port: 5080
