# Metrics, logs and traces in one backend (operator decision, 2026-10-01).
#
# Backups: data-openobserve-0 (Longhorn, 50 Gi), in PBS's nightly backup of the
# RKE2 VMs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: openobserve
helmCharts:
  - name: openobserve-standalone
    repo: https://charts.openobserve.ai
    version: 1.0.1
    releaseName: openobserve
    namespace: openobserve
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - httproute.yaml
  - dashboards.yaml
  - reference-grant.yaml
patches:
  # The ServiceMonitor would select the headless Service too: scrape once.
  - target:
      kind: ServiceMonitor
      name: openobserve
    patch: |-
      - op: add
        path: /spec/selector/matchLabels/prometheus.io~1scrape
        value: "true"
# No hash: nothing here is pruned, so every old ConfigMap would stay behind.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: openobserve-dashboards
    files:
      - dashboards/apps.json
      - dashboards/argocd-monitoring.json
      - dashboards/crowdsec.json
      - dashboards/etcd.json
      - dashboards/host-metrics.json
      - dashboards/import.py
      - dashboards/kubernetes-api-server.json
      - dashboards/kubernetes-clusters-overview.json
      - dashboards/kubernetes-events.json
      - dashboards/kubernetes-namespace-pod.json
      - dashboards/kubernetes-namespace-pods.json
      - dashboards/kubernetes-namespaces.json
      - dashboards/kubernetes-node-pods.json
      - dashboards/kubernetes-nodes-pressure.json
      - dashboards/kubernetes-nodes.json
      - dashboards/longhorn.json
      - dashboards/openobserve.json
      - dashboards/traces-by-service.json
      - dashboards/traces-overall.json
      - dashboards/traefik.json
      - dashboards/vault.json
# No pruning: it holds data.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
