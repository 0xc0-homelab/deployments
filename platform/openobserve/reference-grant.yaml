# The one route from outside this namespace to OpenObserve: offby1.cc's RUM
# intake (apps/offby1-cc/httproute.yaml), /rum/v1/default/rum only. Without
# this grant the Gateway refuses a cross-namespace backend.
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: rum-from-offby1-cc
  namespace: openobserve
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: offby1-cc
  to:
    - group: ""
      kind: Service
      name: openobserve
