# The UI has no login and can delete volumes: basic auth guards it.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: ui-basic-auth
  namespace: longhorn-system
spec:
  basicAuth:
    secret: ui-basic-auth-vault
    removeHeader: true
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: longhorn-ui
  namespace: longhorn-system
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - longhorn.int.0xc0.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: ui-basic-auth
      backendRefs:
        - name: longhorn-frontend
          port: 80
