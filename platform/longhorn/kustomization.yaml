# Data disks joined into /var/lib/longhorn by infrastructure's longhorn_node.
#
# Backups: none of its own. PBS backs up every RKE2 VM whole, data disks
# included.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: longhorn-system
helmCharts:
  - name: longhorn
    repo: https://charts.longhorn.io
    version: 1.13.0
    releaseName: longhorn
    namespace: longhorn-system
    kubeVersion: "1.36.4"
    includeCRDs: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - ui.yaml
  - recurring-jobs.yaml
patches:
  # Argo CD would run this pre-delete hook, uninstalling Longhorn, whenever
  # the Application is deleted.
  - target:
      kind: Job
      name: longhorn-uninstall
    patch: |-
      $patch: delete
      apiVersion: batch/v1
      kind: Job
      metadata:
        name: longhorn-uninstall
# No pruning: it holds the cluster's data.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
