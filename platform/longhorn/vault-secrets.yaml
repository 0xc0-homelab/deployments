apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: longhorn-system
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: longhorn-system
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: longhorn-system
    serviceAccount: vault-secrets
    audiences: [vault]
---
# Shared with traefik.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ui-basic-auth
  namespace: longhorn-system
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/ui-basic-auth
  refreshAfter: 1h
  destination:
    name: ui-basic-auth-vault
    create: true
    # basicAuth reads every key as htpasswd lines: keep only users.
    transformation:
      includes: ["^users$"]
      excludeRaw: true
