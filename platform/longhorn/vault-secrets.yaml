# What this namespace takes from Vault, through Vault Secrets Operator: its
# VaultAuth logs in as the service account below, with the Kubernetes auth
# role named after the namespace (the vault repo), which reads only this
# namespace's paths and the shared secrets granted to it by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: longhorn-system
# Only VSO uses it, asking the API for a token when it logs in.
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: longhorn-system
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: longhorn-system
    serviceAccount: vault-secrets
    audiences: [vault]
---
# The UI basic auth, shared with traefik: the Longhorn UI's Middleware.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: ui-basic-auth
  namespace: longhorn-system
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/ui-basic-auth
  refreshAfter: 1h
  destination:
    name: ui-basic-auth-vault
    create: true
    # Traefik's basicAuth reads every key of the Secret as htpasswd lines:
    # only users, never the operator's password nor VSO's _raw.
    transformation:
      includes: ["^users$"]
      excludeRaw: true
