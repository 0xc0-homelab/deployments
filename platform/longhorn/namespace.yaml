# Longhorn's pods run privileged: they manage the nodes' disks and iSCSI.
apiVersion: v1
kind: Namespace
metadata:
  name: longhorn-system
  labels:
    pod-security.kubernetes.io/enforce: privileged
    # Its UI's route attaches to the Gateway's internal listener (ui.yaml).
    gateway.0xc0.cc/internal: "true"
