# Longhorn otherwise keeps every block ever written: OpenObserve's volume used
# 2 GB but held 12 GiB per replica (2026-10-02). The default group covers every
# volume.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: filesystem-trim
  namespace: longhorn-system
spec:
  name: filesystem-trim
  task: filesystem-trim
  cron: "17 */6 * * *"
  groups:
    - default
  retain: 0
  concurrency: 1
