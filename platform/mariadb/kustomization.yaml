# MariaDB: the one MySQL-compatible server the applications share (operator
# decision, 2026-10-02; gitops#71). One database and one user per application,
# never a server per application. A plain StatefulSet from the official image,
# no operator: an operator costs memory the cluster does not have to spare.
#
# Backups:
# - data-mariadb-0 (Longhorn, 10Gi): the server's datadir, covered by PBS's
#   nightly backup of the RKE2 VMs (03:00). Restoring it rolls every database
#   back at once.
# - mariadb-dumps (Longhorn, 5Gi): a logical dump of each database, nightly at
#   01:30 (dumps.yaml), seven days kept, so one application can be restored
#   alone. Covered by the same PBS backup, which runs after it.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: mariadb
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - statefulset.yaml
  - dumps.yaml
  - databases.yaml
configMapGenerator:
  - name: mariadb-config
    files:
      - homelab.cnf
# No pruning: it holds data.
commonAnnotations:
  argocd.argoproj.io/sync-options: Prune=false
