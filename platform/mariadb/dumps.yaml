# A logical dump of every application database, nightly at 01:30, before
# PBS's 03:00 backup of the RKE2 VMs takes the volume with it. Each database
# to its own directory, seven days kept: restoring one application is loading
# its file, without rolling back the others (kustomization.yaml, Backups).
#
# Backup: this volume is covered by PBS's nightly backup of the RKE2 VMs.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mariadb-dumps
  namespace: mariadb
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mariadb-dumps
  namespace: mariadb
spec:
  schedule: "30 1 * * *"
  timeZone: Europe/Madrid
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: mariadb-dumps
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: dump
              # The server's own image, so the client matches it.
              image: docker.io/library/mariadb:11.8.9@sha256:6422478cb8e159f080fb1d8ccf65101e26fe51385787fde7d16c3b165a331f15
              command:
                - bash
                - -euo
                - pipefail
                - -c
                - |
                  day=$(date +%F)
                  dbs=$(mariadb -h mariadb -u root -N -e 'SHOW DATABASES' \
                    | grep -Ev '^(information_schema|performance_schema|mysql|sys)$' || true)
                  for db in $dbs; do
                    mkdir -p "/dumps/$db"
                    mariadb-dump -h mariadb -u root --single-transaction \
                      --routines --triggers --events --databases "$db" \
                      | gzip > "/dumps/$db/$day.sql.gz.part"
                    mv "/dumps/$db/$day.sql.gz.part" "/dumps/$db/$day.sql.gz"
                    echo "dumped $db"
                  done
                  # A dump that died mid-write leaves its .part behind.
                  find /dumps \( -name '*.sql.gz' -o -name '*.sql.gz.part' \) -mtime +6 -delete
              env:
                # Read by the client and mariadb-dump: off the command line.
                - name: MYSQL_PWD
                  valueFrom:
                    secretKeyRef:
                      name: mariadb-root-vault
                      key: password
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: [ALL]
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  memory: 256Mi
              volumeMounts:
                - name: dumps
                  mountPath: /dumps
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: dumps
              persistentVolumeClaim:
                claimName: mariadb-dumps
            - name: tmp
              emptyDir: {}
