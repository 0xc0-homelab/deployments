# MariaDB reads the root password at its first start only: rotating it is an
# ALTER USER first, then the write to Vault.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: mariadb
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: mariadb
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mariadb
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mariadb-root
  namespace: mariadb
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: mariadb/root
  refreshAfter: 1h
  destination:
    name: mariadb-root-vault
    create: true
    transformation:
      excludeRaw: true
