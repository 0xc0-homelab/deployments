# CrowdSec, the WAF in front of Traefik (operator decision, 2026-09-29): its
# Security Engine (the LAPI, and an agent per node reading Traefik's access
# logs) and its AppSec component, which Traefik's bouncer plugin asks about
# every request. Cloudflare Free leaves application attacks to it.
#
# Backups: the LAPI's two volumes (its database, and its credentials) are on
# Longhorn, so PBS backs them up with the RKE2 servers' data disks.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    kubeVersion: "1.36.4"
    includeCRDs: true
    # The chart's Helm tests would run as plain Pods here.
    skipTests: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - pdb.yaml
