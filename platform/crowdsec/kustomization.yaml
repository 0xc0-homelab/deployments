# The WAF in front of Traefik (operator decision, 2026-09-29): Cloudflare Free
# leaves application attacks to it.
#
# Backups: the LAPI's two Longhorn volumes, in PBS's backup of the RKE2 VMs.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: crowdsec
helmCharts:
  - name: crowdsec
    repo: https://crowdsecurity.github.io/helm-charts
    version: 0.24.2
    releaseName: crowdsec
    namespace: crowdsec
    kubeVersion: "1.36.4"
    includeCRDs: true
    skipTests: true
    valuesFile: values.yaml
resources:
  - namespace.yaml
  - network-policy.yaml
  - vault-secrets.yaml
  - pdb.yaml
