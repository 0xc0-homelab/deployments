# What this namespace takes from Vault, through Vault Secrets Operator: its
# VaultAuth logs in as the service account below, with the Kubernetes auth
# role named after the namespace (the vault repo), which reads only this
# namespace's paths and the shared secrets granted to it by name.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: crowdsec
# Only VSO uses it, asking the API for a token when it logs in.
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: crowdsec
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: crowdsec
    serviceAccount: vault-secrets
    audiences: [vault]
---
# The LAPI's shared secret and AppSec's registration token. Everything that
# reads them from its environment restarts when they change.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: lapi
  namespace: crowdsec
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: crowdsec/lapi
  refreshAfter: 1h
  destination:
    name: crowdsec-lapi-vault
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: crowdsec-lapi
    - kind: Deployment
      name: crowdsec-appsec
    - kind: DaemonSet
      name: crowdsec-agent
---
# The bouncer's key, shared with traefik: the LAPI registers the bouncer
# with it, from its environment.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: bouncer
  namespace: crowdsec
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: platform
  path: shared/crowdsec-bouncer
  refreshAfter: 1h
  destination:
    name: crowdsec-bouncer-vault
    create: true
  rolloutRestartTargets:
    - kind: Deployment
      name: crowdsec-lapi
