# Its database password (apps/mautic/database, key password) and its
# sending provider (apps/mautic/mailer, key dsn), from Vault, through Vault
# Secrets Operator. platform/mariadb reads the database path too, by name in
# its policy, to create the user with it. The admin's login is a
# person's: it lives in ops/mautic/admin, and no machine reads it.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: vault-secrets
  namespace: mautic
automountServiceAccountToken: false
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultAuth
metadata:
  name: vault-secrets
  namespace: mautic
spec:
  method: kubernetes
  mount: kubernetes
  kubernetes:
    role: mautic
    serviceAccount: vault-secrets
    audiences: [vault]
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-database
  namespace: mautic
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: mautic/database
  refreshAfter: 1h
  destination:
    name: mautic-database-vault
    create: true
    transformation:
      excludeRaw: true
---
# The sending provider, as a Symfony mailer DSN (smtp://user:pass@host:port,
# or the provider's own scheme). A new value restarts the pod, so a new
# provider or a rotated credential is one write to Vault.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: mautic-mailer
  namespace: mautic
spec:
  vaultAuthRef: vault-secrets
  type: kv-v2
  mount: apps
  path: mautic/mailer
  refreshAfter: 1h
  rolloutRestartTargets:
    - kind: Deployment
      name: mautic
  destination:
    name: mautic-mailer-vault
    create: true
    transformation:
      excludeRaw: true
