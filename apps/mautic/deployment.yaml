# The three roles of the official image, as containers of one pod: web
# (apache, which also runs the migrations at its start), cron (segments and
# campaigns, every 15 minutes) and worker (the messenger queues, its
# consumers restarted every five minutes: supervisord.conf). One pod, so
# one Longhorn RWO volume serves the three: no RWX, no NFS share-manager.
# cron and worker wait until Mautic is installed (README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mautic-env
  namespace: mautic
data:
  MAUTIC_DB_HOST: mariadb.mariadb.svc.cluster.local
  MAUTIC_DB_PORT: "3306"
  MAUTIC_DB_DATABASE: mautic
  MAUTIC_DB_USER: mautic
  # The queues, in its own database: no broker to run.
  MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
  MAUTIC_MESSENGER_DSN_HIT: doctrine://default
  # Traefik, from the pods' range: its X-Forwarded-* tell Mautic the request
  # was HTTPS, and the client's address.
  MAUTIC_TRUSTED_PROXIES: '["10.42.0.0/16"]'
  PHP_INI_VALUE_DATE_TIMEZONE: Europe/Madrid
  # One consumer per queue instead of two: the traffic is small.
  DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: "1"
  DOCKER_MAUTIC_WORKERS_CONSUME_HIT: "1"
  DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: "1"
---
# Backup: PBS's nightly backup of the RKE2 VMs (kustomization.yaml, Backups).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautic-data
  namespace: mautic
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mautic
  namespace: mautic
spec:
  selector:
    app.kubernetes.io/name: mautic
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic
  namespace: mautic
spec:
  replicas: 1
  # One RWO volume: the old pod lets go of it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      # The official 7.2 image lacks GrapesJS's compiled assets
      # (mautic/docker-mautic#479), so the email builder never loads. The
      # release ZIP of the same version has them: this downloads it, checks
      # it against its pinned sha256, and keeps only the assets, for web.
      # Remove it with the first image that ships them (gitops#87); until
      # then, a bump of the image bumps the version and sha256 here too.
      initContainers:
        - name: grapesjs-assets
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          command:
            - bash
            - -euo
            - pipefail
            - -c
            - |
              curl -fsSL -o /download/mautic.zip \
                "https://github.com/mautic/mautic/releases/download/${MAUTIC_VERSION}/${MAUTIC_VERSION}.zip"
              echo "${MAUTIC_ZIP_SHA256}  /download/mautic.zip" | sha256sum -c -
              unzip -q -o -j /download/mautic.zip \
                'plugins/GrapesJsBuilderBundle/Assets/library/js/dist/*' -d /dist
              rm /download/mautic.zip
              ls -l /dist
          env:
            - name: MAUTIC_VERSION
              value: "7.2.1"
            - name: MAUTIC_ZIP_SHA256
              value: 5c86cf1fe8b4f9818232ce8bb755760f502d47846706e9164d144865d031ecbd
          securityContext:
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: download
              mountPath: /download
            - name: grapesjs-assets
              mountPath: /dist
      containers:
        - name: web
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_web
            - &password
              name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mautic-database-vault
                  key: password
            # The sending provider, from Vault (vault-secrets.yaml). A real
            # environment variable wins over local.php, so the DSN set in
            # Configuration is not used. Optional: without it, Mautic sends
            # nothing.
            - &mailer
              name: MAUTIC_MAILER_DSN
              valueFrom:
                secretKeyRef:
                  name: mautic-mailer-vault
                  key: dsn
                  optional: true
          envFrom: &env
            - configMapRef:
                name: mautic-env
          ports:
            - name: http
              containerPort: 80
          # The migrations run before apache listens: minutes, after an
          # upgrade.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext: &security
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            # Symfony's cache, its own per container (volumes, below).
            - name: cache-web
              mountPath: /var/www/html/var/cache
            # GrapesJS's compiled assets (initContainers, above).
            - name: grapesjs-assets
              mountPath: /var/www/html/docroot/plugins/GrapesJsBuilderBundle/Assets/library/js/dist
              readOnly: true
        - name: cron
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_cron
            - *password
            - *mailer
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-cron
              mountPath: /var/www/html/var/cache
        - name: worker
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_worker
            - *password
            - *mailer
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
            - name: cache-worker
              mountPath: /var/www/html/var/cache
            # Its consumers restart every five minutes (supervisord.conf).
            - name: supervisord
              mountPath: /etc/supervisor/conf.d/supervisord.conf
              subPath: supervisord.conf
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautic-data
        - name: supervisord
          configMap:
            name: mautic-supervisord
        # Symfony's cache, outside the image: the image ships one built
        # before any plugin was enabled, in a layer cache:clear cannot
        # rename on overlayfs (gitops#85). Built anew at every start, one
        # per container, so no two warm it at once.
        - name: cache-web
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-cron
          emptyDir:
            sizeLimit: 512Mi
        - name: cache-worker
          emptyDir:
            sizeLimit: 512Mi
        # The release ZIP, only while the initContainer runs, and the assets
        # it keeps.
        - name: download
          emptyDir:
            sizeLimit: 256Mi
        - name: grapesjs-assets
          emptyDir:
            sizeLimit: 32Mi
