# The three roles of the official image, as containers of one pod: web
# (apache, which also runs the migrations at its start), cron (segments and
# campaigns, every 15 minutes) and worker (the messenger queues). One pod, so
# one Longhorn RWO volume serves the three: no RWX, no NFS share-manager.
# cron and worker wait until Mautic is installed (README.md).
apiVersion: v1
kind: ConfigMap
metadata:
  name: mautic-env
  namespace: mautic
data:
  MAUTIC_DB_HOST: mariadb.mariadb.svc.cluster.local
  MAUTIC_DB_PORT: "3306"
  MAUTIC_DB_DATABASE: mautic
  MAUTIC_DB_USER: mautic
  # The queues, in its own database: no broker to run.
  MAUTIC_MESSENGER_DSN_EMAIL: doctrine://default
  MAUTIC_MESSENGER_DSN_HIT: doctrine://default
  # Traefik, from the pods' range: its X-Forwarded-* tell Mautic the request
  # was HTTPS, and the client's address.
  MAUTIC_TRUSTED_PROXIES: '["10.42.0.0/16"]'
  PHP_INI_VALUE_DATE_TIMEZONE: Europe/Madrid
  # One consumer per queue instead of two: the traffic is small.
  DOCKER_MAUTIC_WORKERS_CONSUME_EMAIL: "1"
  DOCKER_MAUTIC_WORKERS_CONSUME_HIT: "1"
  DOCKER_MAUTIC_WORKERS_CONSUME_FAILED: "1"
---
# Backup: PBS's nightly backup of the RKE2 VMs (kustomization.yaml, Backups).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: mautic-data
  namespace: mautic
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: mautic
  namespace: mautic
spec:
  selector:
    app.kubernetes.io/name: mautic
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mautic
  namespace: mautic
spec:
  replicas: 1
  # One RWO volume: the old pod lets go of it before the new one starts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mautic
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mautic
    spec:
      automountServiceAccountToken: false
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_web
            - &password
              name: MAUTIC_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mautic-database-vault
                  key: password
          envFrom: &env
            - configMapRef:
                name: mautic-env
          ports:
            - name: http
              containerPort: 80
          # The migrations run before apache listens: minutes, after an
          # upgrade.
          startupProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 20
            failureThreshold: 6
          securityContext: &security
            capabilities:
              drop: [NET_RAW]
          resources:
            requests:
              cpu: 100m
              memory: 384Mi
            limits:
              memory: 1Gi
          volumeMounts: &mounts
            - name: data
              mountPath: /var/www/html/config
              subPath: config
            - name: data
              mountPath: /var/www/html/var/logs
              subPath: logs
            - name: data
              mountPath: /var/www/html/docroot/media/files
              subPath: media/files
            - name: data
              mountPath: /var/www/html/docroot/media/images
              subPath: media/images
        - name: cron
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_cron
            - *password
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 20m
              memory: 128Mi
            limits:
              memory: 512Mi
          volumeMounts: *mounts
        - name: worker
          image: docker.io/mautic/mautic:7.2.1-apache@sha256:ff584fd13c8db06b4a7dd640e837dbbde69bd8c40da62140ff6c3c2dd0402abc
          env:
            - name: DOCKER_MAUTIC_ROLE
              value: mautic_worker
            - *password
          envFrom: *env
          securityContext: *security
          resources:
            requests:
              cpu: 50m
              memory: 192Mi
            limits:
              memory: 512Mi
          volumeMounts: *mounts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: mautic-data
