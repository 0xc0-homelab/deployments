# Two names, one backend. https://mautic.0xc0.cc is public: what contacts
# reach (the tracking pixel and scripts, forms, landing pages under any slug,
# the links and unsubscribe pages of its emails, the sending provider's
# callback), behind CrowdSec on websecure. Landing pages take any path, so the
# public side cannot be an allowlist: everything a person uses is refused
# there with a 403, and is reached only at
# https://mautic.int.0xc0.cc, WARP only, with no hint of that name. That is
# Mautic 7.2's own non-public firewall (/s, /elfinder, /efconnect, /api), plus
# the user flows outside it (password reset, invites, SAML, OAuth), the
# integrations' auth callbacks, and the installer. /index.php reaches every
# route again, so it is refused whole, and so is the root, which Mautic sends
# to its dashboard. Its links go out with the public name, its site_url
# (README.md). Checked against the routes of 7.2.1: recheck them on a major
# upgrade.
#
# The one exception: the admin-user flows whose links go out by email, with
# the public name (password reset, invites). Those redirect to the internal
# name, path and query kept, so the link works for someone on WARP and leads
# nowhere for anyone else.
#
# Gateway API has no filter that refuses a request, so Traefik's own
# middleware does: an allow list only Traefik's own loopback would match, and
# every request reaches it from the load balancers.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: refuse
  namespace: mautic
spec:
  ipAllowList:
    sourceRange: [127.0.0.1/32]
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mautic
  namespace: mautic
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-0xc0-cc
  hostnames:
    - mautic.0xc0.cc
  rules:
    - matches:
        - path: {type: PathPrefix, value: /passwordreset}
        - path: {type: PathPrefix, value: /passwordresetconfirm}
        - path: {type: PathPrefix, value: /invite}
      filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect takes its well-known port,
            # not the listener's 8443.
            scheme: https
            hostname: mautic.int.0xc0.cc
            statusCode: 302
    - matches:
        - path: {type: PathPrefix, value: /s}
        - path: {type: PathPrefix, value: /elfinder}
        - path: {type: PathPrefix, value: /efconnect}
        - path: {type: PathPrefix, value: /installer}
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /oauth}
        - path: {type: PathPrefix, value: /saml}
        - path: {type: PathPrefix, value: /plugins}
        - path: {type: PathPrefix, value: /integration}
        - path: {type: PathPrefix, value: /index.php}
        # Until a landing page is Mautic's root URL.
        - path: {type: Exact, value: /}
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: refuse
      # Never reached: the middleware answers first.
      backendRefs:
        - name: mautic
          port: 80
    - backendRefs:
        - name: mautic
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mautic-admin
  namespace: mautic
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: internal
  hostnames:
    - mautic.int.0xc0.cc
  rules:
    - backendRefs:
        - name: mautic
          port: 80
