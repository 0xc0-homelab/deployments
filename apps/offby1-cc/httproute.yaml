# https://offby1.cc is public, behind CrowdSec on websecure; external-dns
# publishes both names (the public annotation). www.offby1.cc only redirects
# to the apex.
#
# The security headers that are the same for every response are set here, by
# Traefik (operator decision, 2026-10-02). The app sets only its
# Content-Security-Policy, whose nonce changes per request
# (0xc0-homelab/offby1.cc: src/proxy.ts). HSTS covers the subdomains, which
# are only ever served over HTTPS here; no preload, which is hard to undo.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: offby1-cc
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    contentTypeNosniff: true
    frameDeny: true
    referrerPolicy: strict-origin-when-cross-origin
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc-apex
  hostnames:
    - offby1.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: offby1-cc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc-www
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc
  hostnames:
    - www.offby1.cc
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect takes its well-known port,
            # not the listener's 8443.
            scheme: https
            hostname: offby1.cc
            statusCode: 301
