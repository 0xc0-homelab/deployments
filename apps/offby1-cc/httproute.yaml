# https://offby1.cc is public, behind CrowdSec on websecure; external-dns
# publishes both names (the public annotation). www.offby1.cc only redirects
# to the apex.
#
# The baseline security headers (HSTS, nosniff, Referrer-Policy) are
# Traefik's, on every entrypoint (platform/traefik/security-headers.yaml).
# This Middleware adds what is this application's: no framing, no browser
# features, and isolation from other origins. The app sets its own
# Content-Security-Policy, whose nonce changes per request
# (0xc0-homelab/offby1.cc: src/proxy.ts).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: offby1-cc
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc-apex
  hostnames:
    - offby1.cc
  rules:
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: offby1-cc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc-www
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc
  hostnames:
    - www.offby1.cc
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect takes its well-known port,
            # not the listener's 8443.
            scheme: https
            hostname: offby1.cc
            statusCode: 301
