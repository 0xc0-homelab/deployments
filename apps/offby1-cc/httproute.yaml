# https://offby1.cc is public, behind CrowdSec on websecure; external-dns
# publishes both names (the public annotation). www.offby1.cc only redirects
# to the apex.
#
# The baseline security headers (HSTS, nosniff, Referrer-Policy) are
# Traefik's, on every entrypoint (platform/traefik/security-headers.yaml).
# This Middleware adds what is this application's: no framing, no browser
# features, and isolation from other origins. The app sets its own
# Content-Security-Policy, whose nonce changes per request
# (0xc0-labs/offby1.cc: src/proxy.ts).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
  namespace: offby1-cc
spec:
  headers:
    frameDeny: true
    permissionsPolicy: camera=(), microphone=(), geolocation=(), payment=(), usb=()
    customResponseHeaders:
      Cross-Origin-Opener-Policy: same-origin
      Cross-Origin-Resource-Policy: same-origin
---
# The RUM intake's limit, per visitor: the SDK batches, a few posts a minute
# per open page. The visitor is CF-Connecting-IP, set by Cloudflare, the only
# way in to this route (the public tunnel).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: rum-rate-limit
  namespace: offby1-cc
spec:
  rateLimit:
    average: 1
    period: 1s
    burst: 20
    sourceCriterion:
      requestHeaderName: Cf-Connecting-Ip
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc-apex
  hostnames:
    - offby1.cc
  rules:
    # The browsers' RUM (the app's src/components/Rum), to OpenObserve's RUM
    # intake: this one path, POST only, rate limited per visitor. OpenObserve
    # itself stays on the WARP-only path; the ReferenceGrant in
    # platform/openobserve admits this route to its Service.
    - matches:
        - path: {type: Exact, value: /rum/v1/default/rum}
          method: POST
      filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: rum-rate-limit
      backendRefs:
        - name: openobserve
          namespace: openobserve
          port: 5080
    - filters:
        - type: ExtensionRef
          extensionRef:
            group: traefik.io
            kind: Middleware
            name: security-headers
      backendRefs:
        - name: offby1-cc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: offby1-cc-www
  namespace: offby1-cc
  annotations:
    gateway.0xc0.cc/public: "true"
spec:
  parentRefs:
    - name: traefik-gateway
      namespace: traefik
      sectionName: websecure-offby1-cc
  hostnames:
    - www.offby1.cc
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            # With the scheme set, the redirect takes its well-known port,
            # not the listener's 8443.
            scheme: https
            hostname: offby1.cc
            statusCode: 301
