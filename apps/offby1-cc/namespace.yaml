# Pod Security restricted: the image runs as node (uid 1000), with nothing to
# chown and no capability. Its routes attach to the public offby1.cc
# listeners (httproute.yaml).
apiVersion: v1
kind: Namespace
metadata:
  name: offby1-cc
  labels:
    pod-security.kubernetes.io/enforce: restricted
    gateway.0xc0.cc/web: "true"
