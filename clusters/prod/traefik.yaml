# Traefik, the cluster's ingress, with the Gateway API (gitops#6). One pod per
# node, behind a NodePort the load balancers' HAProxy already sends the VIP's
# port 80 to. No TLS here: Cloudflare ends it for public traffic, and WARP
# carries the internal one.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.6.0
    helm:
      valuesObject:
        # Pinned by digest, the multi-arch index. Bumping is its own commit.
        image:
          registry: docker.io
          repository: traefik
          tag: v3.7.13
          digest: sha256:24841fe2de7304c149343d877d2923b4c8800a38ba015dea9174c23b20e344a0
        # One per node: with externalTrafficPolicy Local, a node answers the
        # NodePort only through its own pod, and the source address survives.
        deployment:
          kind: DaemonSet
        providers:
          kubernetesGateway:
            enabled: true
          # Traefik's own CRDs, for Middlewares: CrowdSec's bouncer is one.
          kubernetesCRD:
            enabled: true
          kubernetesIngress:
            enabled: false
        # Routes are Gateway API only: no IngressClass either.
        ingressClass:
          enabled: false
        gateway:
          listeners:
            web:
              port: 8000
              protocol: HTTP
              # A namespace opts in to attach routes here with the label
              # gateway.0xc0.cc/web: "true"; no other can claim a hostname.
              namespacePolicy:
                from: Selector
                selector:
                  matchLabels:
                    gateway.0xc0.cc/web: "true"
        service:
          spec:
            type: NodePort
            # No SNAT on the way in: Traefik sees the load balancer's
            # address, so it can trust its forwarded headers and nobody
            # else's.
            externalTrafficPolicy: Local
        ports:
          web:
            nodePort: 30080
            # The client's address comes in X-Forwarded-For, which cloudflared
            # sets (with CF-Connecting-IP). Trusted only from the two load
            # balancers, vm-lb-01 and vm-lb-02: HAProxy connects from each
            # one's own address, not the VIP. The rest of platform (the nodes,
            # later the data services) cannot forge it.
            forwardedHeaders:
              trustedIPs: [10.10.4.11/32, 10.10.4.12/32]
          websecure:
            expose:
              default: false
        # What CrowdSec reads.
        accessLog:
          enabled: true
          format: json
  destination:
    server: https://kubernetes.default.svc
    namespace: traefik
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # The Gateway API CRDs may still be on their way.
    retry:
      limit: 10
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
