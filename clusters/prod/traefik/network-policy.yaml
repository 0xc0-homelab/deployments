# Traefik denies ingress but for its web entrypoint, from the two load
# balancers (vm-lb-01, vm-lb-02): HAProxy connects from each one's own address,
# which the NodePort keeps (externalTrafficPolicy Local). Nothing else in
# platform, the nodes included, reaches it. Its dashboard, metrics and ping stay closed; kubelet's probes come
# from the pod's own node, which a NetworkPolicy always allows.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: traefik
spec:
  podSelector: {}
  policyTypes:
    - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: web-from-load-balancers
  namespace: traefik
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: traefik
  policyTypes:
    - Ingress
  ingress:
    - from:
        - ipBlock:
            cidr: 10.10.4.11/32
        - ipBlock:
            cidr: 10.10.4.12/32
      ports:
        - protocol: TCP
          port: 8000
