# Longhorn: the cluster's storage, and its default StorageClass. Every volume
# has three replicas, one per node, on each node's two data disks, which the
# longhorn_node role in infrastructure joins into /var/lib/longhorn.
#
# Backups: none of its own. PBS backs the three VMs up whole, data disks
# included, so every Longhorn volume is in the VM backups.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: longhorn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://charts.longhorn.io
    chart: longhorn
    targetRevision: 1.13.0
    helm:
      valuesObject:
        # Pinned by digest, each the multi-arch index, from the chart's own
        # values.yaml. Bumping is its own commit: the chart and its images.
        image:
          longhorn:
            engine:
              repository: longhornio/longhorn-engine
              tag: "v1.13.0@sha256:b0cc5090889d57705acd69c5106492992e84560170ac3bec4a1cc8dd3fe83ca6"
            manager:
              repository: longhornio/longhorn-manager
              tag: "v1.13.0@sha256:7372f3c59239e9a67c0017b3af32fabdf08c4dcc0631140161da9a47e3b142f0"
            ui:
              repository: longhornio/longhorn-ui
              tag: "v1.13.0@sha256:f22fb0254ae50195c1635ce428dfae26375956b3d7bd39640fae8fe33a236023"
            instanceManager:
              repository: longhornio/longhorn-instance-manager
              tag: "v1.13.0@sha256:fc9e1c15e81988b04c146866ce7010b6df3a70f88302809bf53e19b27d1658a3"
            shareManager:
              repository: longhornio/longhorn-share-manager
              tag: "v1.13.0@sha256:53950f78b7af38b8a943c298cd3020622191a4661a13036f69d83c154cc8690d"
            backingImageManager:
              repository: longhornio/backing-image-manager
              tag: "v1.13.0@sha256:49779b9a8ab535f1e86d224f8e2eb5c2c3713b8f1783403fe00612a75de2b3b8"
            supportBundleKit:
              repository: longhornio/support-bundle-kit
              tag: "v0.0.98@sha256:e64a01db35396f967175adcfd0177d2a50e75765c51efe86e55f13f49095d1ae"
          csi:
            attacher:
              repository: longhornio/csi-attacher
              tag: "v4.13.0@sha256:fef34c2d823b78da7d6c29fdf0f80d236293b0ac06944d14e8c366add880a4c8"
            provisioner:
              repository: longhornio/csi-provisioner
              tag: "v6.3.0@sha256:2d2694540109d2e8887f62a0bc711aca8d3033e52dddf1c39bb5c65600d9c5af"
            nodeDriverRegistrar:
              repository: longhornio/csi-node-driver-registrar
              tag: "v2.18.0@sha256:085f63e62fea391734f5668d9cbb20ac8788a8e7faea83ce2c994f0cc1834fce"
            resizer:
              repository: longhornio/csi-resizer
              tag: "v2.2.1@sha256:63d0aef25114d4a682b25afa6d9623a3cfcc19aca910269124408476bbe2c6fd"
            snapshotter:
              repository: longhornio/csi-snapshotter
              tag: "v8.6.0@sha256:2bca9ac55170efa61dc50e5cc8d9550373db2e3e5161d82d3fdaac5c25150360"
            livenessProbe:
              repository: longhornio/livenessprobe
              tag: "v2.20.0@sha256:d1199b77452bfc11cfc62feb8a266758fe8d72953e97faac8065941e3767f1a3"
        # Longhorn's install guide for Argo CD: its pre-upgrade hook job does
        # not fit a GitOps sync.
        preUpgradeChecker:
          jobEnabled: false
        persistence:
          defaultClass: true
          defaultClassReplicaCount: 3
        defaultSettings:
          defaultDataPath: /var/lib/longhorn
          defaultReplicaCount: 3
        # Every Longhorn pod denies what it does not need. The API server
        # (the webhook's caller) and the iSCSI initiators run on the nodes'
        # own network, so both come from platform.
        networkPolicies:
          enabled: true
          restrictInternalTraffic: true
          type: rke2
          kubeAPIServerSourceCIDRs: [10.10.4.0/24]
          v1DataEngineInitiatorSourceCIDRs: [10.10.4.0/24]
  destination:
    server: https://kubernetes.default.svc
    namespace: longhorn-system
  syncPolicy:
    automated:
      # No pruning: deleting what holds the cluster's data is never a side
      # effect of a sync.
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      # Longhorn's CRDs are too large for the annotation client-side apply
      # keeps.
      - ServerSideApply=true
