# The Gateway API's standard CRDs, at the version Traefik 3.7 supports
# (v1.6.2). Their own Application, from the project's repo pinned by tag, so
# Traefik's chart never has to carry them. Applied first (wave -1); Traefik's
# sync retries until they are there.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  project: default
  source:
    repoURL: https://github.com/kubernetes-sigs/gateway-api.git
    targetRevision: v1.6.2
    path: config/crd/standard
  destination:
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      # Removing a CRD deletes every object of its kind: never as a side
      # effect of a sync.
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
