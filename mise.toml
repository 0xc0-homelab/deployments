# Tooling for the gitops repo: helm renders each Application's chart with its
# values, and kubeconform validates what comes out, before ArgoCD ever sees it.
[tools]
sops        = "3.13.3"
age         = "1.3.2"
jq          = "1.8.2"
helm        = "4.3.0"
kubeconform = "0.8.0"
yq          = "4.53.6"

[env]
# Same path on macOS and Linux. Without it sops looks in a macOS-only location.
SOPS_AGE_KEY_FILE = "{{env.HOME}}/.config/sops/age/keys.txt"
